<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -2 32 32" width="200" height="200">
  <defs>
    <style>
      #flap-left-js { transform-box: fill-box; transform-origin: 1px 5px; animation: bd-mtype-left 0.5s ease-in-out infinite; }
      #flap-right-js { transform-box: fill-box; transform-origin: 23px 5px; animation: bd-mtype-right 0.5s ease-in-out infinite 0.25s; }
